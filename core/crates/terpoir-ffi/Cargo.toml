[package]
name = "terpoir-ffi"
description = "Terpoir core exposed to Kotlin and Swift through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib for Android (JNA), staticlib for iOS, lib for Rust tests.
crate-type = ["cdylib", "staticlib", "lib"]
name = "terpoir_ffi"

[dependencies]
terpoir-crypto.workspace = true
terpoir-model.workspace = true
terpoir-scan.workspace = true
terpoir-store.workspace = true
terpoir-sync.workspace = true
uniffi.workspace = true
zeroize.workspace = true

[dev-dependencies]
terpoir-crypto.workspace = true

[lints]
workspace = true
