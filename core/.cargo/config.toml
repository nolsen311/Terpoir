[env]
# Compile SQLCipher's own logging out entirely (it would otherwise write to
# stderr, logcat or the Apple console). Release builds log nothing; see
# docs/design-decisions.md, "Logs and crash reports".
LIBSQLITE3_FLAGS = "-DSQLCIPHER_OMIT_LOG -DSQLCIPHER_OMIT_LOG_DEVICE"
