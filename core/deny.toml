# cargo-deny policy for the Rust core. Run from core/: `cargo deny check`.
# CI: .github/workflows/supply-chain.yml.

[graph]
all-features = true

[advisories]
# Known vulnerabilities always fail. Also fail on yanked, unmaintained and
# unsound crates anywhere in the graph. Any ignore needs an advisory ID and
# a reason.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # basic-toml is unmaintained (archived 2025-03-02). It comes in only
    # through askama_derive, which uniffi_bindgen uses to generate the
    # Kotlin and Swift bindings at build time; it parses askama's template
    # config and is never linked into the app. askama_derive 0.16.1, the
    # newest, still depends on it. Drop this when uniffi's askama moves off
    # it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only (uniffi_bindgen → askama_derive); no maintained replacement upstream yet" },
]

[licenses]
# Licenses compatible with GPL-3.0-or-later. Adding one needs a reason in
# the pull request. Our own crates are unpublished (publish = false) and
# are skipped below; their license is the project's (see LICENSING.md).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The allow list is a policy, not an inventory; entries not yet used are fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates.
allow-wildcard-paths = true
# Crates that contradict the design: no crash reporting, telemetry or
# analytics, ever (docs/design-decisions.md, "Logs and crash reports").
deny = [
    { crate = "sentry", reason = "crash reporting SDK" },
    { crate = "sentry-core", reason = "crash reporting SDK" },
    { crate = "opentelemetry", reason = "telemetry" },
    { crate = "opentelemetry_sdk", reason = "telemetry" },
    { crate = "bugsnag", reason = "crash reporting SDK" },
    { crate = "rollbar", reason = "crash reporting SDK" },
]

[sources]
# crates.io only. A git or alternate-registry dependency needs a reason
# and an explicit entry here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
