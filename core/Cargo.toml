[workspace]
resolver = "3"
members = [
    "crates/terpoir-crypto",
    "crates/terpoir-model",
    "crates/terpoir-store",
    "crates/terpoir-sync",
    "crates/terpoir-scan",
    "crates/terpoir-insights",
    "crates/terpoir-tagging",
    "crates/terpoir-catalog",
    "crates/terpoir-ffi",
    "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later WITH AdditionRef-Terpoir-AppStore-exception"
repository = "https://github.com/nolsen311/Terpoir"
publish = false

[workspace.dependencies]
terpoir-crypto = { path = "crates/terpoir-crypto" }
terpoir-model = { path = "crates/terpoir-model" }
terpoir-store = { path = "crates/terpoir-store" }
terpoir-sync = { path = "crates/terpoir-sync" }
terpoir-scan = { path = "crates/terpoir-scan" }
terpoir-insights = { path = "crates/terpoir-insights" }
terpoir-tagging = { path = "crates/terpoir-tagging" }
terpoir-catalog = { path = "crates/terpoir-catalog" }

aead-stream = { version = "0.6", features = ["alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
# HPKE (RFC 9180) for write-only capture: notes written while the journal is
# locked are sealed to the capture key pair's public key. Only the X25519 and
# ChaCha20-Poly1305 suites; it reuses the RustCrypto crates above and adds
# x25519-dalek / curve25519-dalek. MIT/Apache-2.0 (dalek: BSD-3-Clause); no
# network, no telemetry.
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
# SQLCipher with OpenSSL built from source, so Android and iOS builds need no
# system crypto library.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
secrecy = "0.10"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# The plaintext export's JSON (terpoir-ffi). Already in the graph through
# UniFFI's build tooling, so no new crate. MIT/Apache-2.0; no network, no
# telemetry.
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
uniffi = "0.32"
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# Mirrors .github/workflows/rust.yml so editors flag the same things. CI
# remains the backstop. clippy.toml allows unwrap and printing in tests.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"
strip = "symbols"
debug = false
