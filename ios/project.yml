#
# The iOS app's Xcode project, as a reviewable spec (docs/roadmap.md, "iOS",
# I2). XcodeGen turns it into Terpoir.xcodeproj, which is a build product
# and never committed:
#
#   ios/scripts/build-core.sh && xcodegen generate --spec ios/project.yml
#
# CI builds XcodeGen from a pinned commit (.github/workflows/ios.yml).

name: Terpoir

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TerpoirCore:
    path: TerpoirCore

settings:
  base:
    # Versions follow Android's for the same core (docs/roadmap.md, "iOS").
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # iPhone only for the MVP.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"

targets:
  Terpoir:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TerpoirCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Terpoir
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The journal never goes to the Files app or iTunes file sharing.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.terpoir
        PRODUCT_NAME: Terpoir

  TerpoirTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Terpoir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.terpoir.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Terpoir:
    build:
      targets:
        Terpoir: all
    test:
      targets: [TerpoirTests]
