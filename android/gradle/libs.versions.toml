# Every dependency and its reason. New entries need a stated reason
# (network access, telemetry, license) in the pull request.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
compose-bom = "2026.09.00"
junit = "4.13.2"
jna = "5.19.1"
play-age-signals = "0.0.4"
camerax = "1.6.2"
zxing = "3.5.4"
tesseract4android = "4.9.0"
play-feature-delivery = "2.1.0"
play-asset-delivery = "2.2.2"
play-mlkit-text-recognition = "19.0.1"
play-services-location = "21.4.0"
play-services-maps = "20.1.0"
maplibre = "13.6.1"
okhttp = "5.5.0"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
# Hosts the Compose UI in an Activity. Apache-2.0; no network, no telemetry.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
# App-wide foreground/background signal for auto-lock. Apache-2.0; no
# network, no telemetry.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
# Aligns Compose library versions. Apache-2.0.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
# Material 3 components. Apache-2.0; no network, no telemetry.
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# LocalLifecycleOwner for binding the camera to the screen. Apache-2.0; no
# network, no telemetry.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
# In-app camera for label, receipt and code scans: frames and photos stay in
# memory and are never written to storage. Apache-2.0; no network, no
# telemetry.
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
# Barcode and QR decoding on the device. Apache-2.0; pure Java, no network,
# no telemetry.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# The open text recognition engine for label and receipt scans: Tesseract
# 5.5.1 with Leptonica, libpng and libjpeg, through a JNI wrapper. Bundled in
# the foss app; on Play it is in the on-demand `:ocr` module, never the base.
# Apache-2.0 (wrapper, Tesseract); Leptonica, libpng and IJG licenses for the
# rest (texts in app/src/main/assets/licenses/). No network, no telemetry.
# Only on JitPack (settings.gradle.kts); its prebuilt native code logs a few
# fixed status lines (never image or text content), see
# docs/design-decisions.md, "Rapid product entry".
tesseract4android = { module = "cz.adaptech.tesseract4android:tesseract4android", version.ref = "tesseract4android" }
# Lets the generated UniFFI bindings call the Rust core (libterpoir_ffi.so).
# Apache-2.0 (dual-licensed with LGPL-2.1); no network, no telemetry.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# Play flavor only: Google Play Age Signals, read on the device at first
# launch. Proprietary (Android SDK License), allowed by the Google Play
# libraries permission in LICENSING.md. Talks to the Play Store app over
# IPC (the app itself has no INTERNET permission); pulls in Play services
# basement and tasks. The foss flavor never contains it.
play-age-signals = { module = "com.google.android.play:age-signals", version.ref = "play-age-signals" }
# Play flavor only: Play Feature Delivery and Play Asset Delivery, which
# install the on-demand text recognition module (`:ocr`) and its model
# (`:ocr-model`) when the user first scans and agrees. Proprietary (Play
# Core Software Development Kit terms), allowed by the Google Play libraries
# permission in LICENSING.md. The Play Store app downloads the files; the
# libraries talk to it over IPC and send nothing themselves. Asset delivery
# stays on 2.2.x: 2.3.0 adds WorkManager, with its own permissions.
play-feature-delivery = { module = "com.google.android.play:feature-delivery", version.ref = "play-feature-delivery" }
play-asset-delivery = { module = "com.google.android.play:asset-delivery", version.ref = "play-asset-delivery" }
# Play flavor only, used only when the user turns on "Google text
# recognition" (off by default): ML Kit text recognition through Google
# Play services, which downloads and updates the model. Proprietary, allowed
# by the Google Play libraries permission. Its Google Data Transport
# dependency sends usage metrics (never scanned text) while it is on; its
# disclosure card says so (docs/design-decisions.md, "Rapid product entry").
# Never in foss.
play-mlkit-text-recognition = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version.ref = "play-mlkit-text-recognition" }
# Play flavor only: geofencing for "Notify me" (off by default), which waits
# for a short stop before alerting. Proprietary, allowed by the Google Play
# libraries permission in LICENSING.md. Talks to Play services over IPC; the
# app has no INTERNET permission. Without Play services the app uses the
# platform's LocationManager, as the foss build always does.
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
# Google Maps, Play flavor only: an active choice of map provider
# (docs/design-decisions.md, "Map picker"), never created unless the online
# map is on and Google is the provider. Proprietary (Google APIs Terms of
# Service), like the other Play libraries; does its own networking through
# Play services, outside the map gateway, as its card says.
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "play-services-maps" }
# The opt-in online map for picking a spot's location (docs/design-decisions.md,
# "Map picker"). MapLibre Native, BSD-2-Clause, with its geojson, turf and
# gestures helpers (MIT, BSD-2-Clause), Gson (Apache-2.0, for GeoJSON) and
# Timber (Apache-2.0; no logging tree is planted). No telemetry (MapLibre removed
# Mapbox's). The OpenGL build: the default one requires Vulkan, which would
# hide the app from phones without it. Its manifest adds INTERNET (kept only
# in builds with a MapTiler key), ACCESS_NETWORK_STATE and ACCESS_WIFI_STATE
# (removed; the app tells MapLibre it is online), and the location
# permissions the app already has. Every request goes through the app's
# gateway (`MapGateway`). Its native code links liblog; logging is turned off.
maplibre = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }
# MapLibre's HTTP client, which the map gateway configures. Apache-2.0; no
# telemetry. Already a dependency of MapLibre, named here because the app
# uses it directly.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Instrumented tests only, never shipped. Apache-2.0.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
# Unit tests only. EPL-1.0, never shipped.
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# The library, on-demand feature and asset pack modules of the text
# recognition engine; same Android Gradle plugin.
android-library = { id = "com.android.library", version.ref = "agp" }
android-dynamic-feature = { id = "com.android.dynamic-feature", version.ref = "agp" }
android-asset-pack = { id = "com.android.asset-pack", version.ref = "agp" }
# Compose compiler; also pins the Kotlin version used by AGP's built-in Kotlin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
