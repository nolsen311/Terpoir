#
# Reproducible-build checks: each builds twice, from checkouts in different
# directories, with a clean build cache each time, and fails unless the two
# are byte-for-byte identical.
# - reproducible: the Rust core for the host. core/scripts/reproducible-build.sh
#   is the same recipe anyone can run to verify a published hash.
# - android-core: the Rust core for Android, as release builds and F-Droid
#   build it (`-Pterpoir.reproducible`), the second time with a different
#   Cargo home, as another machine would have.
# - foss-apk: the whole unsigned foss release APK, as release.yml builds it
#   (with the OCR libraries from source, built once by ocr-aar), on two
#   runners at once (foss-apk-build), the second from another path with a
#   different Cargo home and Gradle home; foss-apk compares them. F-Droid
#   publishes the maintainer-signed APK only if its own build matches.
#
# On pull requests android-core and the foss-apk jobs run only when the
# build itself changes (build scripts, Gradle files, ProGuard rules, the
# OCR recipe, core/ or .github/), not for app code alone (maintainer,
# 2026-10-22: they are the slowest checks). Pushes to main, the weekly run
# and manual runs check everything.

name: Reproducible build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the jobs below on pull requests that change nothing they check
  # (a skipped job still reports, so it can be a required check).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.files.outputs.run }}
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/changes.sh '^(core/|\.github/)' >> "$GITHUB_OUTPUT"

      # What can change how the app is built: the build scripts, Gradle's
      # files, ProGuard rules, the OCR recipe, the core and CI itself.
      - name: Check the changed files (Android build)
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          .github/scripts/changes.sh '^(core/|\.github/|android/[^/]+$|android/gradle/|android/ocr-native/|android/[^/]+/(build\.gradle\.kts|proguard-rules\.pro)$)' \
            | sed 's/^run=/build=/' >> "$GITHUB_OUTPUT"

  reproducible:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elsewhere/second-checkout
          persist-credentials: false

      - name: First build
        working-directory: first
        run: |
          set -euo pipefail
          core/scripts/reproducible-build.sh | tail -n 1 > "$RUNNER_TEMP/first.sha256"
          rm -rf /tmp/terpoir-reproducible

      - name: Second build
        working-directory: elsewhere/second-checkout/core
        run: |
          set -euo pipefail
          scripts/reproducible-build.sh | tail -n 1 > "$RUNNER_TEMP/second.sha256"

      - name: Compare
        run: |
          set -euo pipefail
          first=$(cat "$RUNNER_TEMP/first.sha256")
          second=$(cat "$RUNNER_TEMP/second.sha256")
          echo "first:  $first"
          echo "second: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::The core library is not reproducible: the two builds differ."
            exit 1
          fi
          echo "### Reproducible core library" >> "$GITHUB_STEP_SUMMARY"
          echo "\`libterpoir_ffi.so\` (x86_64-unknown-linux-gnu): \`$first\`" >> "$GITHUB_STEP_SUMMARY"

  android-core:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elsewhere/second-checkout
          persist-credentials: false

      - name: Validate Gradle wrapper
        working-directory: first/android
        run: |
          set -euo pipefail
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          curl -sSfL --proto '=https' --tlsv1.2 https://services.gradle.org/versions/all \
            | python3 -c "import json,sys; print('\n'.join(v['wrapperChecksum'] for v in json.load(sys.stdin) if v.get('wrapperChecksum')))" \
            | grep -qx "$actual"

      - name: Set up Rust core toolchain
        working-directory: first
        run: .github/scripts/setup-android-core.sh

      - name: First build
        working-directory: first/android
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon --no-build-cache -Pterpoir.reproducible=true :app:buildRustCore
          (cd app/build/generated/rust/jniLibs && sha256sum */libterpoir_ffi.so) | tee "$RUNNER_TEMP/first.sha256"
          rm -rf /tmp/terpoir-android-core

      - name: Second build (another Cargo home)
        working-directory: elsewhere/second-checkout/android
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          ./gradlew --no-daemon --no-build-cache -Pterpoir.reproducible=true :app:buildRustCore
          (cd app/build/generated/rust/jniLibs && sha256sum */libterpoir_ffi.so) | tee "$RUNNER_TEMP/second.sha256"

      - name: Compare
        run: |
          set -euo pipefail
          if ! diff "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"; then
            echo "::error::The Android core library is not reproducible: the two builds differ."
            exit 1
          fi
          {
            echo "### Reproducible Android core library"
            echo '```'
            cat "$RUNNER_TEMP/first.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The OCR libraries from source, once for both APK builds, as release.yml
  # builds them; the OCR workflow checks their own reproducibility.
  ocr-aar:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the OCR native libraries
        run: .github/scripts/ocr-from-source.sh "$RUNNER_TEMP/ocr-native"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-ocr-aar
          path: ${{ runner.temp }}/ocr-native/*.aar
          if-no-files-found: error
          retention-days: 1

  # The two APK builds, on separate runners at the same time. The second
  # builds from another path with another Cargo home and Gradle home.
  foss-apk-build:
    needs: ocr-aar
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - copy: first
            checkout: first
            other-homes: false
          - copy: second
            checkout: elsewhere/second-checkout
            other-homes: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.checkout }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        working-directory: ${{ matrix.checkout }}/android
        run: |
          set -euo pipefail
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          curl -sSfL --proto '=https' --tlsv1.2 https://services.gradle.org/versions/all \
            | python3 -c "import json,sys; print('\n'.join(v['wrapperChecksum'] for v in json.load(sys.stdin) if v.get('wrapperChecksum')))" \
            | grep -qx "$actual"

      - name: Set up Rust core toolchain
        working-directory: ${{ matrix.checkout }}
        run: .github/scripts/setup-android-core.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproducible-ocr-aar
          path: ${{ runner.temp }}/ocr-native

      - name: Build
        id: build
        working-directory: ${{ matrix.checkout }}/android
        env:
          OTHER_HOMES: ${{ matrix.other-homes }}
          COPY: ${{ matrix.copy }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          if [ "$OTHER_HOMES" = true ]; then
            export CARGO_HOME="$RUNNER_TEMP/cargo-home"
            export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"
          fi
          aar=$(ls "$RUNNER_TEMP"/ocr-native/*.aar)
          echo "aar=$aar" >> "$GITHUB_OUTPUT"
          ./gradlew --no-daemon --no-build-cache -Pterpoir.reproducible=true -Pterpoir.ocr.aar="$aar" :app:assembleFossRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk "$RUNNER_TEMP/apk/$COPY.apk"
          sha256sum "$RUNNER_TEMP/apk/$COPY.apk"

      # As release.yml checks the APK and writes the SBOMs (that workflow
      # only runs on a tag); once is enough.
      - name: Check the shipped OCR libraries and write the release SBOMs
        if: matrix.copy == 'second'
        working-directory: ${{ matrix.checkout }}
        env:
          OCR_AAR: ${{ steps.build.outputs.aar }}
        run: |
          set -euo pipefail
          .github/scripts/check-ocr-libs.sh "$RUNNER_TEMP/apk/second.apk"
          export CARGO_HOME="$RUNNER_TEMP/cargo-home"
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"
          .github/scripts/release-sboms.sh "$RUNNER_TEMP/sboms" 0.0.0-check "$OCR_AAR"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foss-apk-${{ matrix.copy }}
          path: ${{ runner.temp }}/apk/${{ matrix.copy }}.apk
          if-no-files-found: error
          retention-days: 14

  # The comparison. Keeps the job name the check had when it built both
  # APKs itself. Both APKs stay as artifacts for 14 days, for diffoscope
  # when they differ.
  foss-apk:
    needs: [changes, foss-apk-build]
    # Runs (and fails) when a build failed too: a skipped check would pass.
    if: always() && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Both builds succeeded
        env:
          BUILDS: ${{ needs.foss-apk-build.result }}
        run: |
          if [ "$BUILDS" != success ]; then
            echo "::error::An APK build (or the OCR build) did not succeed: $BUILDS."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: foss-apk-*
          merge-multiple: true
          path: apks

      - name: Compare
        working-directory: apks
        run: |
          set -euo pipefail
          sha256sum first.apk second.apk
          if ! cmp -s first.apk second.apk; then
            echo "::error::The foss APK is not reproducible: the two builds differ (both kept as the foss-apk-first and foss-apk-second artifacts)."
            exit 1
          fi
          {
            echo "### Reproducible foss APK (unsigned)"
            echo "\`$(sha256sum first.apk | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
