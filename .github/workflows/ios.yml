#
# The Rust core and the app on iOS (docs/roadmap.md, "iOS"): builds
# terpoir-ffi for iPhones and the simulator into an xcframework with Swift
# bindings (ios/scripts/build-core.sh), runs the TerpoirCore package's tests
# on an iOS simulator, then generates the app's Xcode project from
# ios/project.yml with XcodeGen and runs the app's tests. Needs macOS; the repository is public, so GitHub's
# macOS runners cost nothing. No signing and no secrets here.

name: iOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Skips the job below on pull requests that change neither the core nor
  # iOS (a skipped job still reports, so it can be a required check).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/changes.sh '^(core/|ios/|\.github/workflows/ios\.yml)' >> "$GITHUB_OUTPUT"

  ios-core:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Apple silicon, so the simulator slice is aarch64-apple-ios-sim.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's preinstalled rustup; core/rust-toolchain.toml pins the
      # toolchain. No third-party toolchain action.
      - name: Install toolchain
        id: toolchain
        working-directory: core
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | head -1 | tr -cd 'A-Za-z0-9.')" >> "$GITHUB_OUTPUT"

      # The compiled core and its dependencies (OpenSSL, SQLCipher...), so
      # only what changed is rebuilt (maintainer, 2026-11-14). Saved only on
      # main (below), so a pull request can never seed it; Cargo checks
      # every crate against Cargo.lock either way.
      - name: Restore the iOS core build
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            core/target
          key: rust-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml', 'core/.cargo/config.toml', 'ios/scripts/build-core.sh') }}
          restore-keys: rust-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Build the core for iOS
        run: ios/scripts/build-core.sh

      - name: Save the iOS core build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            core/target
          key: rust-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml', 'core/.cargo/config.toml', 'ios/scripts/build-core.sh') }}

      # The minimum test counts live in these scripts, beside the tests.
      - name: Test the core package on the iOS simulator
        run: ios/scripts/test-package.sh

      # XcodeGen turns ios/project.yml into the Xcode project. Built from a
      # pinned commit (2.46.0, MIT) with its own Package.resolved pins; a
      # build tool only, never part of the app. The built tool is cached by
      # that commit, saved only on main.
      - name: Restore XcodeGen
        id: xcodegen-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xcodegen
          key: xcodegen-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-8445e778451c7e44237b90281bde622d764b0084

      - name: Build XcodeGen
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        env:
          XCODEGEN_COMMIT: 8445e778451c7e44237b90281bde622d764b0084 # 2.46.0
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/xcodegen"
          git init --quiet "$src"
          git -C "$src" fetch --quiet --depth 1 https://github.com/yonaskolb/XcodeGen "$XCODEGEN_COMMIT"
          git -C "$src" checkout --quiet FETCH_HEAD
          (cd "$src" && swift build -c release --product xcodegen --force-resolved-versions)
          # XcodeGen's install layout: the tool in bin/, its setting presets
          # in share/xcodegen/, where it looks next to itself. Built from
          # source it would also find them through the checkout's path,
          # which a cached copy doesn't have, so the checkout goes and every
          # run uses the layout the cache holds.
          mkdir -p ~/xcodegen/bin ~/xcodegen/share/xcodegen
          cp "$src/.build/release/xcodegen" ~/xcodegen/bin/
          cp -R "$src/SettingPresets" ~/xcodegen/share/xcodegen/
          rm -rf "$src"

      - name: Save XcodeGen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.xcodegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xcodegen
          key: xcodegen-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-8445e778451c7e44237b90281bde622d764b0084

      - name: Put XcodeGen on the PATH
        run: |
          set -euo pipefail
          # A copy without its presets makes projects with empty product
          # names; fail here instead.
          test -f ~/xcodegen/share/xcodegen/SettingPresets/base.yml
          echo "$HOME/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Test the app on the iOS simulator
        run: ios/scripts/test-app.sh
