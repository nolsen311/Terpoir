#
# OpenSSF Scorecard: supply-chain security checks on this repository's
# settings and workflows. Findings appear under Security → Code scanning.
# Results are also published to the public Scorecard API (the repository is
# public; this exposes nothing that is not already public), which enables
# the README badge and lets users verify the score independently.

name: Scorecard

on:
  # Branch-protection checks need the default branch.
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 2"
  # Re-run when branch protection rules change.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload SARIF to code scanning.
      security-events: write
      # Sign the published results (OIDC); required by publish_results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
