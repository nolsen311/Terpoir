#
# Builds the OCR native libraries (Tesseract, Leptonica, libpng, libjpeg and
# the Tesseract4Android JNI wrapper) from pinned, hash-checked source
# tarballs with android/ocr-native/build.sh: the build F-Droid uses for the
# foss flavor instead of the prebuilt JitPack AAR (android/ocr-native/
# README.md).
#
# Asynchronous on purpose: it takes several minutes and is not a required
# check. It runs weekly (catching drift in the runner or a download), on
# demand, and when the pins or the recipe change. The app's own CI keeps
# using the JitPack artifact and does not wait for this.
#
# Reproducibility: two runners build from checkouts at different paths,
# the second with the SDK reached through a different path too;
# both results must be byte-identical, and must match the hashes committed
# in android/ocr-native/SHA256SUMS. After an intended change (a version
# bump), update that file from the hashes this workflow prints.

name: OCR native libraries

on:
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/ocr-native/**"
      - ".github/workflows/ocr-native.yml"
      # The NDK version and minSdk are read from here, and the
      # terpoir.ocr.aar switch lives here and in settings.gradle.kts.
      - "android/app/build.gradle.kts"
      - "android/settings.gradle.kts"
  pull_request:
    paths:
      - "android/ocr-native/**"
      - ".github/workflows/ocr-native.yml"
      - "android/settings.gradle.kts"

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

concurrency:
  group: ocr-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - copy: first
            checkout: first
            sdk: ""
          - copy: second
            checkout: elsewhere/second-checkout
            sdk: elsewhere/android-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.checkout }}
          persist-credentials: false

      - name: Install NDK, CMake and platform
        working-directory: ${{ matrix.checkout }}
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          { yes || true; } | "$sdk/sdkmanager" --licenses >/dev/null
          read -ra packages <<< "$(android/ocr-native/build.sh --sdk-packages)"
          "$sdk/sdkmanager" "${packages[@]}" >/dev/null
          echo "Installed: ${packages[*]}"

      - name: Build
        working-directory: ${{ matrix.checkout }}
        env:
          OCR_WORK: ${{ runner.temp }}/${{ matrix.copy }}/work
          SDK_ALIAS: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          if [ -n "$SDK_ALIAS" ]; then
            mkdir -p "$(dirname "$RUNNER_TEMP/$SDK_ALIAS")"
            ln -s "$ANDROID_HOME" "$RUNNER_TEMP/$SDK_ALIAS"
            export ANDROID_HOME="$RUNNER_TEMP/$SDK_ALIAS"
          fi
          "$JAVA_HOME/bin/javac" -version
          android/ocr-native/build.sh "$RUNNER_TEMP/ocr-native"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-native-${{ matrix.copy }}
          path: ${{ runner.temp }}/ocr-native
          if-no-files-found: error
          retention-days: 90

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: android/ocr-native

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocr-native-first
          path: ${{ runner.temp }}/first

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocr-native-second
          path: ${{ runner.temp }}/second

      - name: Compare
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/first"
          second="$RUNNER_TEMP/second"
          # The recorded hashes must cover the files actually there.
          (cd "$first" && sha256sum -c --quiet SHA256SUMS)
          (cd "$second" && sha256sum -c --quiet SHA256SUMS)
          {
            echo "### OCR native libraries"
            echo '```'
            cat "$first/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$first/SHA256SUMS"
          if ! diff -u "$first/SHA256SUMS" "$second/SHA256SUMS"; then
            echo "::error::Not reproducible: the two builds differ."
            exit 1
          fi
          if ! grep -v '^#' android/ocr-native/SHA256SUMS | diff -u - "$first/SHA256SUMS"; then
            echo "::error::Reproducible, but different from android/ocr-native/SHA256SUMS. If the change is intended (a version bump), commit the hashes above to that file."
            exit 1
          fi
          echo "Both builds are identical and match android/ocr-native/SHA256SUMS."

  # The foss flavor built the way F-Droid builds it: with the from-source
  # AAR (-Pterpoir.ocr.aar), so JitPack is never declared. Checks that the
  # release passes its own verification and that the shipped Tesseract
  # libraries are the ones built here (no Android logging; the JitPack
  # build logs status lines).
  foss-app:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloaded dependencies only: Gradle's modules and wrapper, the
      # Cargo registry, and cargo-ndk. Saved only by the Android job on
      # main (android.yml), so a pull request can never seed it; Gradle still
      # checks every artifact against verification-metadata.xml, and Cargo
      # every crate against Cargo.lock.
      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
          key: deps-${{ runner.os }}-${{ hashFiles('android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', 'core/Cargo.lock', '.github/scripts/setup-android-core.sh') }}
          restore-keys: deps-${{ runner.os }}-

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocr-native-first
          path: ${{ runner.temp }}/ocr-native

      - name: Set up Rust core toolchain
        run: .github/scripts/setup-android-core.sh

      - name: Build the foss release with the from-source libraries
        working-directory: android
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon --no-build-cache \
            -Pterpoir.ocr.aar="$RUNNER_TEMP/ocr-native/tesseract4android-4.9.0.aar" \
            assembleFossRelease verifyFossReleaseNoLogging verifyFossDependencies

      - name: Check the shipped OCR libraries
        run: |
          set -euo pipefail
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"$/\1/p' android/app/build.gradle.kts)
          nm="$ANDROID_HOME/ndk/$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf="$ANDROID_HOME/ndk/$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          apk=$(ls android/app/build/outputs/apk/foss/release/*.apk)
          libs="$RUNNER_TEMP/apk-libs"
          mkdir -p "$libs"
          (cd "$libs" && unzip -q -o "$GITHUB_WORKSPACE/$apk" 'lib/*')
          found=0
          for lib in "$libs"/lib/*/libtesseract.so "$libs"/lib/*/libleptonica.so "$libs"/lib/*/libjpeg.so "$libs"/lib/*/libpngx.so; do
            found=$((found + 1))
            if "$nm" -D --undefined-only "$lib" | grep -q '__android_log'; then
              echo "::error::$lib calls Android's logger: not the from-source build."
              exit 1
            fi
            if "$readelf" -d "$lib" | grep -q 'liblog.so'; then
              echo "::error::$lib links liblog: not the from-source build."
              exit 1
            fi
          done
          [ "$found" -eq 8 ] || { echo "::error::expected 8 OCR libraries in the APK, found $found"; exit 1; }
          echo "The foss release ships the from-source OCR libraries, none of which logs."
