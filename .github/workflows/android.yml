#
# Android app CI: builds every variant (play/foss x debug/release), runs unit
# tests and lint (warnings are errors), and the privacy checks:
#   - verifyFossDependencies: no proprietary Google libraries in FOSS.
#   - verify<Variant>Permissions: no permission outside the allowlist.
# Every downloaded artifact is checked against
# android/gradle/verification-metadata.xml. The build compiles the Rust core
# (cargo-ndk) and generates its Kotlin bindings.
#
# The instrumented job runs the on-device tests on an Android 11 (minSdk)
# emulator, with no Google services.

name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the jobs below on pull requests that change nothing they check
  # (a skipped job still reports, so it can be a required check).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/changes.sh '^(android/|core/|\.github/)' >> "$GITHUB_OUTPUT"

  android:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # No incremental build files and no debug info in the host build the
    # bindings come from (UniFFI reads symbols, not debug info): smaller
    # and faster to build and to cache.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloaded dependencies only: Gradle's modules and wrapper, the
      # Cargo registry, and cargo-ndk. Saved only by the Android job on
      # main (android.yml), so a pull request can never seed it; Gradle still
      # checks every artifact against verification-metadata.xml, and Cargo
      # every crate against Cargo.lock.
      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
          key: deps-${{ runner.os }}-${{ hashFiles('android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', 'core/Cargo.lock', '.github/scripts/setup-android-core.sh') }}
          restore-keys: deps-${{ runner.os }}-

      # The wrapper JAR is a binary in the repo: check it is one Gradle
      # published, against Gradle's own list of wrapper checksums.
      - name: Validate Gradle wrapper
        run: |
          set -euo pipefail
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          curl -sSfL --proto '=https' --tlsv1.2 https://services.gradle.org/versions/all \
            | python3 -c "import json,sys; print('\n'.join(v['wrapperChecksum'] for v in json.load(sys.stdin) if v.get('wrapperChecksum')))" \
            | grep -qx "$actual"
          echo "gradle-wrapper.jar matches a published Gradle release ($actual)"

      - name: Set up Rust core toolchain
        id: setup
        working-directory: .
        run: .github/scripts/setup-android-core.sh

      # The Rust core's build output (core/target, with the unpacked crate
      # sources, whose timestamps Cargo checks), so a run recompiles only
      # the workspace crates, not the ~100 dependencies. Saved only by this
      # job on main, like the dependency cache, so a pull request can never
      # seed it; releases (release.yml) and the reproducible-build check
      # never use it. Keyed on everything that changes the compiled
      # dependencies: Cargo.lock, the toolchain, the core's Cargo config
      # and the NDK.
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/src
            core/target
          key: rust-android-${{ runner.os }}-${{ steps.setup.outputs.ndk }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml', 'core/.cargo/config.toml') }}
          restore-keys: rust-android-${{ runner.os }}-${{ steps.setup.outputs.ndk }}-

      # The throwaway debug signing key, kept between runs so each test
      # build installs over the last one. It signs debug builds only and is
      # never a release key; saved only from main, like the dependencies.
      - name: Restore debug signing key
        id: debug-key
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      # Gradle creates the key on first use, but where depends on the
      # runner's environment, and it never reached the path above: create
      # it there when the cache has none, and point Gradle at it
      # (ANDROID_USER_HOME, in the build step). Same parameters as the
      # Android Gradle plugin's own.
      - name: Create debug signing key
        if: steps.debug-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storetype PKCS12 \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US"

      # The Play flavor's debug Google Maps key (docs/design-decisions.md,
      # "Map picker"), restricted to the Maps SDK, the package and the debug
      # certificates. The release key never reaches CI. Without the secret
      # (forks) the debug build doesn't offer Google Maps.
      - name: Build, test, lint and verify
        env:
          GOOGLE_MAPS_API_KEY_DEBUG: ${{ secrets.GOOGLE_MAPS_API_KEY_DEBUG }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_USER_HOME="$HOME/.android"
          ./gradlew --no-daemon --no-build-cache --profile assemble check lintFossRelease lintPlayRelease

      # The test builds must be signed with the cached key, or each one
      # would need an uninstall (which deletes the test journal).
      - name: Check the debug signing key
        run: |
          set -euo pipefail
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          key=$(keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | sha256sum | cut -d' ' -f1)
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -qi "certificate SHA-256 digest: $key" \
              || { echo "$apk is not signed with the cached debug key" >&2; exit 1; }
          done
          echo "Debug builds signed with the cached key (certificate SHA-256 $key)"

      # Gradle's own timing report (task names and durations only), to see
      # what makes this job slow. It stays with the run; no build scan is
      # uploaded anywhere.
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-profile
          path: android/build/reports/profile
          if-no-files-found: ignore
          retention-days: 14

      # Debug builds to install for testing (debug-signed, logging kept).
      # Use the foss one: the Play debug build lacks text recognition,
      # which only Google Play can install for it.
      - name: Upload test builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terpoir-debug-apks
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save debug signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Save Rust build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/src
            core/target
          key: rust-android-${{ runner.os }}-${{ steps.setup.outputs.ndk }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml', 'core/.cargo/config.toml') }}

      # This job resolves every dependency, so its cache is the complete one.
      - name: Save dependency cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
          key: deps-${{ runner.os }}-${{ hashFiles('android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', 'core/Cargo.lock', '.github/scripts/setup-android-core.sh') }}

  instrumented:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SYSTEM_IMAGE: "system-images;android-30;default;x86_64"
      # As in the android job.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloaded dependencies only: Gradle's modules and wrapper, the
      # Cargo registry, and cargo-ndk. Saved only by the Android job on
      # main (android.yml), so a pull request can never seed it; Gradle still
      # checks every artifact against verification-metadata.xml, and Cargo
      # every crate against Cargo.lock.
      - name: Restore dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
          key: deps-${{ runner.os }}-${{ hashFiles('android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', 'core/Cargo.lock', '.github/scripts/setup-android-core.sh') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Rust core toolchain
        id: setup
        working-directory: .
        run: .github/scripts/setup-android-core.sh

      # As in the android job; this job builds x86_64 only, so it keeps
      # its own.
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/src
            core/target
          key: rust-instrumented-${{ runner.os }}-${{ steps.setup.outputs.ndk }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml', 'core/.cargo/config.toml') }}
          restore-keys: rust-instrumented-${{ runner.os }}-${{ steps.setup.outputs.ndk }}-

      # The emulator boots while the app builds: start it first, wait for
      # it after the build.
      - name: Start emulator
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          # avdmanager and the emulator disagree on the default AVD
          # directory, so pin it for both.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          { yes || true; } | "$sdk/sdkmanager" --licenses >/dev/null
          "$sdk/sdkmanager" emulator platform-tools "$SYSTEM_IMAGE" >/dev/null
          echo no | "$sdk/avdmanager" create avd -n ci -k "$SYSTEM_IMAGE"
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &

      # The emulator is x86_64, so the Rust core is built for that ABI only.
      - name: Build app and test APKs
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon --no-build-cache --profile -Pterpoir.abis=x86_64 assembleFossDebug assembleFossDebugAndroidTest

      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-build-profile
          path: android/build/reports/profile
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Rust build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/src
            core/target
          key: rust-instrumented-${{ runner.os }}-${{ steps.setup.outputs.ndk }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml', 'core/.cargo/config.toml') }}

      - name: Wait for the emulator
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 300 "$adb" wait-for-device
          timeout 600 sh -c "until [ \"\$($adb shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 5; done"

      # Plain adb + am instrument, so no extra test-runner artifacts are
      # downloaded at run time. The Keystore tests need a secure lock screen,
      # so the emulator gets a PIN first. The activity tests need the app in
      # front, so the screen is woken, unlocked and kept on before the PIN is
      # set (it never turns off, so the PIN never locks it).
      - name: Run instrumented tests
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" shell svc power stayon true
          "$adb" shell input keyevent KEYCODE_WAKEUP
          "$adb" shell wm dismiss-keyguard
          "$adb" shell locksettings set-pin 1234
          "$adb" install -r app/build/outputs/apk/foss/debug/app-foss-debug.apk
          "$adb" install -r app/build/outputs/apk/androidTest/foss/debug/app-foss-debug-androidTest.apk
          timeout 900 "$adb" shell am instrument -w app.terpoir.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/instrument.txt"
          grep -q "^OK (" "$RUNNER_TEMP/instrument.txt"

      # Test data is synthetic, so the emulator log and logcat are safe to
      # print.
      - name: Emulator diagnostics
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/emulator.log" || true
          timeout 30 "$ANDROID_HOME/platform-tools/adb" logcat -d -t 300 || true

  # Publishes main's debug APKs as one rolling pre-release, tagged
  # dev-build, so the latest test build is always at the same address
  # (docs/design-decisions.md, "Test builds"). Each push to main replaces
  # it. Only this job may write releases, and it checks out no code: it
  # takes the APKs the android job built.
  dev-build:
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-build
      cancel-in-progress: false
    steps:
      - name: Download the test builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terpoir-debug-apks
          path: apks

      - name: Replace the dev-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir out
          cp "$(find apks -name 'app-foss-debug.apk' | head -n 1)" out/terpoir-foss-debug.apk
          cp "$(find apks -name 'app-play-debug.apk' | head -n 1)" out/terpoir-play-debug.apk
          (cd out && sha256sum *.apk > SHA256SUMS)
          short="${GITHUB_SHA::7}"
          cat > notes.md <<NOTES
          **Unstable development build. Expect bugs.** Built automatically from \`main\` at ${GITHUB_SHA} on $(date -u +%Y-%m-%d). Every merge to \`main\` replaces it.

          - Install **terpoir-foss-debug.apk**. The Play debug build lacks text recognition, which only Google Play can install for it.
          - Debug-signed with a throwaway CI key, so each new build installs over the last. A real release will not install over it (uninstall first, which deletes the test journal).
          - For testing only: keep nothing in it you can't lose.
          NOTES
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build out/* \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Development build ${short} (unstable)" \
            --notes-file notes.md
