#
# CodeQL code scanning. Results appear under Security → Code scanning.
#
# Languages switch on as their code lands, so the workflow never fails on a
# language with no source:
#   - actions: always (these workflow files).
#   - rust: once core/Cargo.toml exists.
#   - java-kotlin: once android/ exists, built explicitly (debug variants of
#     both flavors) so all Kotlin source sets are analyzed.
#   - swift: later, with ios/ (needs a macOS runner).

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new queries run against unchanged code.
    - cron: "23 5 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      run: ${{ steps.files.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests that change no code or workflows skip the analysis.
      - name: Check the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/changes.sh '^(android/|core/|\.github/)' >> "$GITHUB_OUTPUT"

      - name: Detect languages present in the tree
        id: detect
        run: |
          set -euo pipefail
          include='{"language":"actions","build-mode":"none"}'
          if [ -f core/Cargo.toml ]; then
            include="${include},"'{"language":"rust","build-mode":"none"}'
          fi
          if [ -d android ]; then
            include="${include},"'{"language":"java-kotlin","build-mode":"manual"}'
          fi
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"

  # Always runs, so every "analyze (<language>)" check reports: a job skipped
  # as a whole never expands its matrix, and the required checks would wait
  # forever on pull requests that change no code. Those runs skip each step
  # instead, and pass in seconds.
  analyze:
    name: analyze (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - name: Nothing to analyze
        if: needs.languages.outputs.run != 'true'
        run: echo "No code or workflow changes in this pull request; analysis skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.languages.outputs.run == 'true'
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: needs.languages.outputs.run == 'true'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Downloaded dependencies only; see android.yml, which saves it.
      - name: Restore dependency cache
        if: needs.languages.outputs.run == 'true' && matrix.build-mode == 'manual'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
          key: deps-${{ runner.os }}-${{ hashFiles('android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', 'core/Cargo.lock', '.github/scripts/setup-android-core.sh') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Set up Rust core toolchain
        if: needs.languages.outputs.run == 'true' && matrix.build-mode == 'manual'
        run: .github/scripts/setup-android-core.sh

      - name: Build Android app
        if: needs.languages.outputs.run == 'true' && matrix.build-mode == 'manual'
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon --no-build-cache assembleFossDebug assemblePlayDebug

      - name: Analyze
        if: needs.languages.outputs.run == 'true'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
