#
# CodeQL code scanning. Results appear under Security → Code scanning.
#
# Languages switch on as their code lands, so the workflow never fails on a
# language with no source:
#   - actions: always (these workflow files).
#   - rust: once core/Cargo.toml exists.
#   - java-kotlin: once android/ exists, built explicitly (debug variants of
#     both flavors) so all Kotlin source sets are analyzed.
#   - swift: once ios/ exists, on a macOS runner: the Rust core is built
#     first (untraced, from ios.yml's build cache), then the TerpoirCore
#     package's Swift is built for the simulator under CodeQL. On pull
#     requests only when ios/ or core/ changes (maintainer, 2026-11-14:
#     the slowest check, on scarce macOS runners); always on main and
#     weekly.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new queries run against unchanged code.
    - cron: "23 5 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      run: ${{ steps.files.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests that change no code or workflows skip the analysis.
      - name: Check the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/changes.sh '^(android/|core/|ios/|\.github/)' >> "$GITHUB_OUTPUT"

      # Swift runs on macOS runners, which are few: only for changes to the
      # Swift code or the core it wraps.
      - name: Check the changed files (Swift)
        id: swift
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/changes.sh '^(core/|ios/|\.github/workflows/codeql\.yml)' | sed 's/^run=/swift=/' >> "$GITHUB_OUTPUT"

      - name: Detect languages present in the tree
        id: detect
        env:
          SWIFT: ${{ steps.swift.outputs.swift }}
        run: |
          set -euo pipefail
          include='{"language":"actions","build-mode":"none"}'
          if [ -f core/Cargo.toml ]; then
            include="${include},"'{"language":"rust","build-mode":"none"}'
          fi
          if [ -d android ]; then
            include="${include},"'{"language":"java-kotlin","build-mode":"manual"}'
          fi
          if [ -d ios ] && [ "$SWIFT" = true ]; then
            include="${include},"'{"language":"swift","build-mode":"manual","runner":"macos-15"}'
          fi
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"

  # Always runs, so every "analyze (<language>)" check reports: a job skipped
  # as a whole never expands its matrix, and the required checks would wait
  # forever on pull requests that change no code. Those runs skip each step
  # instead, and pass in seconds.
  analyze:
    name: analyze (${{ matrix.language }})
    needs: languages
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - name: Nothing to analyze
        if: needs.languages.outputs.run != 'true'
        run: echo "No code or workflow changes in this pull request; analysis skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.languages.outputs.run == 'true'
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        id: toolchain
        if: needs.languages.outputs.run == 'true' && matrix.language == 'swift'
        working-directory: core
        run: |
          set -euo pipefail
          rustup toolchain install
          echo "xcode=$(xcodebuild -version | head -1 | tr -cd 'A-Za-z0-9.')" >> "$GITHUB_OUTPUT"

      # ios.yml saves it on main; restore only here.
      - name: Restore the iOS core build
        if: needs.languages.outputs.run == 'true' && matrix.language == 'swift'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            core/target
          key: rust-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml', 'core/.cargo/config.toml', 'ios/scripts/build-core.sh') }}
          restore-keys: rust-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-

      # Before CodeQL starts tracing, so only the Swift build is traced.
      - name: Build the core for iOS
        if: needs.languages.outputs.run == 'true' && matrix.language == 'swift'
        run: ios/scripts/build-core.sh

      - name: Initialize CodeQL
        if: needs.languages.outputs.run == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Downloaded dependencies only; see android.yml, which saves it.
      - name: Restore dependency cache
        if: needs.languages.outputs.run == 'true' && matrix.language == 'java-kotlin'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
          key: deps-${{ runner.os }}-${{ hashFiles('android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties', 'core/Cargo.lock', '.github/scripts/setup-android-core.sh') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Set up Rust core toolchain
        if: needs.languages.outputs.run == 'true' && matrix.language == 'java-kotlin'
        run: .github/scripts/setup-android-core.sh

      - name: Build Android app
        if: needs.languages.outputs.run == 'true' && matrix.language == 'java-kotlin'
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon --no-build-cache assembleFossDebug assemblePlayDebug

      - name: Build the iOS core package
        if: needs.languages.outputs.run == 'true' && matrix.language == 'swift'
        working-directory: ios/TerpoirCore
        run: xcodebuild build -scheme TerpoirCore -destination 'generic/platform=iOS Simulator' -quiet

      - name: Analyze
        if: needs.languages.outputs.run == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
