#
# Version updates. Security updates are enabled separately in repository
# settings.
#
# Gradle updates also change android/gradle/verification-metadata.xml, which
# Dependabot does not regenerate: run
#   GRADLE_USER_HOME=$(mktemp -d) ./gradlew --write-verification-metadata sha256 \
#     assemble check lintFossRelease lintPlayRelease assembleFossDebugAndroidTest
# on its branch before merging (the Android check fails until then).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let new releases age before adopting them, to avoid pulling a
    # compromised version in its first days.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
