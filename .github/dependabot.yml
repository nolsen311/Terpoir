#
# Version updates. Security updates are enabled separately in repository
# settings. Add the gradle ecosystem when android/ exists (see
# docs/roadmap.md).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let new releases age before adopting them, to avoid pulling a
    # compromised version in its first days.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
